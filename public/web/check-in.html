<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Falcon Check-in</title>
    <link rel="stylesheet" href="module.css" />
  </head>
  <body>
    <h1 data-i18n="title">Choose your seat</h1>
    <span class="badge" id="transport">web module</span>
    <div class="card">
      <div id="passenger" class="muted">—</div>
      <div id="flight"><strong>—</strong></div>
    </div>
    <div id="seatmap" class="seatmap" role="grid" aria-label="Seat map"></div>
    <p class="muted"><span data-i18n="selected">Selected seat</span>: <strong id="selected">—</strong></p>
    <button id="confirm" type="button" disabled data-i18n="confirm">Confirm check-in</button>
    <div id="done" class="done" hidden></div>

    <script src="falcon-bridge.js"></script>
    <script src="i18n.js"></script>
    <script src="check-in.js"></script>
  </body>
</html>
